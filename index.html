<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Co-op Shape Herding</title>
<style>
html,body{margin:0;height:100%;background:#1f2430;color:white;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#wrap{height:100%;display:grid;place-items:center}
canvas{border:4px solid #fff;border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.35);max-width:96vw;max-height:82vh}
#hud{font-size:32px;position:fixed;top:10px;left:50%;transform:translateX(-50%);text-align:center;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:12px;user-select:none}
#hud b{color:#ffd166}
#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 14px;border-radius:12px;text-align:center;font-size:28px;user-select:none}
</style>
</head>
<body>
<div id="hud"><div><b>Co-op Shape Herding</b> — Level <span id="level">1</span></div><div>Shapes left: <span id="left">20</span></div></div>
<div id="wrap"><canvas id="game" width="1000" height="650"></canvas></div>
<div id="help">Player 1: <b>W/S</b> = up/down, hold <b>A</b> to lift &nbsp; • &nbsp; Player 2: <b>←/→</b> = left/right, hold <b>↑</b> to lift<br>Both lift buttons must be held at the same time. Release either one and the shape drops.</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),levelEl=document.getElementById('level'),leftEl=document.getElementById('left');
const W=canvas.width,H=canvas.height,keys={};let level=1,shapes=[],carrying=null,gameWon=false,transitionTimer=0;
const floorColors=['#f3e5ab','#d9c2f0','#f2c4a7'];
const player={x:W/2,y:H/2,r:22,speed:4.2};
const pens={
circle:{x:35,y:35,w:180,h:115,color:'#d62828',label:'RED CIRCLES'},
square:{x:W-215,y:35,w:180,h:115,color:'#111111',label:'BLACK SQUARES'},
triangle:{x:35,y:H-150,w:180,h:115,color:'#2a9d3f',label:'GREEN TRIANGLES'},
pentagon:{x:W-215,y:H-150,w:180,h:115,color:'#1976d2',label:'BLUE PENTAGONS'}};
const typeInfo={circle:{color:'#d62828'},square:{color:'#111111'},triangle:{color:'#2a9d3f'},pentagon:{color:'#1976d2'}};
const rand=(a,b)=>Math.random()*(b-a)+a;
function pointInAnyPen(x,y,m=0){return Object.values(pens).some(p=>x>p.x-m&&x<p.x+p.w+m&&y>p.y-m&&y<p.y+p.h+m)}
function spawnLevel(){shapes=[];carrying=null;player.x=W/2;player.y=H/2;gameWon=false;transitionTimer=0;
for(const type of Object.keys(typeInfo))for(let i=0;i<5;i++){let x,y,t=0;do{x=rand(240,W-240);y=rand(120,H-120);t++}while((pointInAnyPen(x,y,35)||Math.hypot(x-player.x,y-player.y)<80)&&t<100);shapes.push({type,x,y,size:17,sorted:false})}updateHud()}
function updateHud(){levelEl.textContent=level;leftEl.textContent=shapes.filter(s=>!s.sorted).length}
function drawPen(p){ctx.save();ctx.globalAlpha=.18;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.globalAlpha=1;ctx.lineWidth=4;ctx.strokeStyle=p.color;ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.fillStyle=p.color;ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(p.label,p.x+p.w/2,p.y+22);ctx.restore()}
function polygon(cx,cy,r,n,rot=0){ctx.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function drawShape(s){if(s.sorted)return;ctx.save();ctx.fillStyle=typeInfo[s.type].color;ctx.strokeStyle='white';ctx.lineWidth=2;
if(s.type==='circle'){ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();ctx.stroke()}
else if(s.type==='square'){ctx.fillRect(s.x-s.size,s.y-s.size,s.size*2,s.size*2);ctx.strokeRect(s.x-s.size,s.y-s.size,s.size*2,s.size*2)}
else{polygon(s.x,s.y,s.size*1.2,s.type==='triangle'?3:5,-Math.PI/2);ctx.fill();ctx.stroke()}ctx.restore()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#6c63ff';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.arc(-7,-5,5,0,Math.PI*2);ctx.arc(7,-5,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-7,-5,2,0,Math.PI*2);ctx.arc(7,-5,2,0,Math.PI*2);ctx.fill();ctx.restore()}
function nearestShape(d){let b=null,bd=d;for(const s of shapes)if(!s.sorted){let x=Math.hypot(s.x-player.x,s.y-player.y);if(x<bd){b=s;bd=x}}return b}
function inCorrectPen(s){let p=pens[s.type];return s.x>p.x&&s.x<p.x+p.w&&s.y>p.y&&s.y<p.y+p.h}
function tryDrop(){if(!carrying)return;if(inCorrectPen(carrying))carrying.sorted=true;carrying=null;updateHud();if(shapes.every(s=>s.sorted)){if(level<3)transitionTimer=90;else gameWon=true}}
function update(){if(gameWon)return;if(keys.w)player.y-=player.speed;if(keys.s)player.y+=player.speed;if(keys.arrowleft)player.x-=player.speed;if(keys.arrowright)player.x+=player.speed;player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(player.r,Math.min(H-player.r,player.y));let both=keys.a&&keys.arrowup;if(both&&!carrying)carrying=nearestShape(45);if(carrying){if(both){carrying.x=player.x;carrying.y=player.y-34}else tryDrop()}if(transitionTimer>0&&!--transitionTimer){level++;spawnLevel()}}
function drawShark(){ctx.save();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(120,110,W-240,H-220);ctx.fillStyle='#1d3557';ctx.textAlign='center';ctx.font='bold 48px Arial';ctx.fillText('YOU DID IT!',W/2,175);ctx.font='150px Arial';ctx.fillText('🦈',W/2,365);ctx.font='bold 30px Arial';ctx.fillText('All 3 levels sorted!',W/2,455);ctx.font='22px Arial';ctx.fillText('Press R to play again',W/2,505);ctx.restore()}
function draw(){ctx.fillStyle=floorColors[level-1];ctx.fillRect(0,0,W,H);Object.values(pens).forEach(drawPen);shapes.forEach(drawShape);drawPlayer();if(gameWon)drawShark()}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow'))e.preventDefault();if(gameWon&&k==='r'){level=1;spawnLevel()}});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();keys[k]=false;if(k.startsWith('arrow'))e.preventDefault()});
spawnLevel();loop();
</script>
</body>
</html>
